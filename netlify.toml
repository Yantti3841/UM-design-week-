[build]
  command = "pnpm exec vite build --config vite.netlify.config.ts --outDir dist/client"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  VITE_WALL_WS_URL = "wss://umdw-flower-api.guanxer.workers.dev/api/wall"

# Database and HTTP API are served by this account's Cloudflare Worker.
[[redirects]]
  from = "/api/*"
  to = "https://umdw-flower-api.guanxer.workers.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "https://umdw-flower-api.guanxer.workers.dev/admin"
  status = 302
  force = true
[[redirects]]
  from = "/invite"
  to = "/invite.html"
  status = 200
[[redirects]]
  from = "/scan"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/links"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/wall"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/archive"
  to = "/index.html"
  status = 200
